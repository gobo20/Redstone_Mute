plugins {
    id 'fabric-loom' version "${fabric.loom.version}"
    id 'maven-publish'
}

version = "${mod.version}"
group = "${maven.group}"

base {
    archivesName = "${archives.baseName}"
}

repositories {
    maven { url 'https://maven.parchmentmc.org' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        'redstonesoundmute-client' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft.version}"
    mappings "net.fabricmc:yarn:${yarn.version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader.version}"
    modImplementation "net.fabricmc:fabric-api:${fabric.api.version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
}
